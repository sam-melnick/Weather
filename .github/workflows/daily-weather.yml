name: Daily Weather Update

# ─────────────────────────────────────────────────────────────────────────────
# Scheduling notes
#   GitHub queues scheduled jobs and delays them — often 15-60+ min, and WORST
#   at round times like :00 / :30 because that's when everyone schedules. So we
#   run EARLY and on an ODD minute to dodge the crowd.
#     '11 8  * * *'  -> 08:11 UTC = 4:11 AM ET (EDT) / 3:11 AM ET (EST)  [morning]
#     '11 16 * * *'  -> 16:11 UTC = 12:11 PM ET (EDT) / 11:11 AM ET (EST) [midday]
#   Even with a bad delay the morning run lands well before 6 AM ET.
#   Cron is always UTC and does not follow daylight saving, so ET times shift
#   by an hour between summer and winter.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '11 8 * * *'
    - cron: '11 16 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

# Let the built-in GITHUB_TOKEN push commits back to the repo. No personal
# access token (PAT) secret required.
permissions:
  contents: write

# Never let two runs push at the same time.
concurrency:
  group: daily-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weather agent
        env:
          OUTPUT_PATH: index.html
          # No PUSH_VIA_API here: the agent only writes the file; the step
          # below commits it. This avoids the old double-push race.
        run: python weather_agent.py

      - name: Commit and push updated forecast
        run: |
          git config user.name "Weather Bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather forecast - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
