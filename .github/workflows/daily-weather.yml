name: Daily Weather Update

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weather agent
        env:
          GITHUB_TOKEN: ${{ secrets.WEATHER_PAT }}
          OUTPUT_PATH: index.html
        run: python weather_agent.py

      - name: Keep repo active
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@weather.local"
          date > .last-run
          git add .last-run
          git commit -m "Weather update $(date -u +%Y-%m-%d)" || true
          git push || true
