name: Daily Weather Update

on:
  schedule:
    - cron: '17 8 * * *'
    - cron: '43 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate weather page
        id: generate
        continue-on-error: true
        run: python weather_agent.py
        env:
          OUTPUT_PATH: index.html

      - name: Commit and push
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@weather.local"
          date > .last-run
          git add .last-run
          if [ "${{ steps.generate.outcome }}" = "success" ]; then
            git add index.html
            echo "Adding updated weather page"
          else
            echo "Script failed — only pushing keepalive"
          fi
          git diff --cached --quiet && echo "No changes" || git commit -m "Weather $(date -u '+%Y-%m-%d %H:%M')"
          git push
