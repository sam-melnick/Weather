name: Daily Weather Update

# ─────────────────────────────────────────────────────────────────────────────
# How this gets triggered
#   1. PRIMARY: cron-job.org calls GitHub's "workflow_dispatch" API at
#      5:30 AM and 6:30 AM ET. Dispatch runs start within seconds, unlike
#      GitHub's own schedule, which has been running 5-9 hours late.
#      See SETUP_MORNING_TRIGGER.md for the setup.
#   2. BACKUP: the GitHub schedule below. Unreliable timing, but harmless.
#   3. MANUAL: the "Run workflow" button in the Actions tab.
# Cron times are UTC and don't follow daylight saving.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '11 8 * * *'    # ~4:11 AM EDT / 3:11 AM EST (often late)
    - cron: '11 16 * * *'   # ~12:11 PM EDT / 11:11 AM EST
  workflow_dispatch: {}

# Built-in GITHUB_TOKEN pushes the commit. No personal token needed here.
permissions:
  contents: write

# Never let two runs push at the same time (e.g. cron-job.org + schedule).
concurrency:
  group: daily-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run weather agent
        env:
          OUTPUT_PATH: index.html
        run: python weather_agent.py

      - name: Commit and push updated forecast
        run: |
          git config user.name "Weather Bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git pull --rebase --quiet || true
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather forecast - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
